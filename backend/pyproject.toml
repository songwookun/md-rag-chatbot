# 빌드 백엔드를 명시한다.
#   이 섹션이 없으면 pip 가 레거시 경로로 떨어져서, 환경에 따라
#   `pip install -e .` 가 거부된다(PEP 660 편집 설치를 못 함).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-rag-backend"
version = "0.1.0"
description = "md-rag-chatbot Python backend (FastAPI)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",           # 웹 프레임워크
    "uvicorn[standard]>=0.32",  # ASGI 서버 (개발/운영 기동)
    "pydantic>=2.9",            # 요청/응답 타입 검증 (TS의 interface 역할)
    "pydantic-settings>=2.6",   # 환경변수 → 타입 있는 Settings 객체
    "httpx>=0.27",              # async HTTP 클라이언트 (GitHub API 호출용)
    "google-genai>=1.0",        # Gemini SDK (임베딩 + 생성)
    "pinecone>=6.0",            # 벡터 DB 클라이언트
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",     # async 함수 테스트
    "respx>=0.21",              # httpx 호출 모킹 (GitHub 어댑터 테스트용)
]

# 재순위화(실험③에서 채택). RERANK_ENABLED=true 로 쓰려면 필요하다.
#   ★ 서빙 기본 의존성([project].dependencies)에 넣지 않는다 — torch 만 2GB 라
#     배포 이미지가 불어난다. 작은 인스턴스에서는 설치하지 말고 RERANK_ENABLED=false.
rerank = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]

# 실험 노트북(../notebooks/)용. 백엔드 실행에는 불필요
lab = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "numpy>=2.0",               # 코사인 유사도 계산
    "pandas>=2.2",              # 결과 표
    "matplotlib>=3.9",          # 점수 분포 시각화
    "python-dotenv>=1.0",       # 노트북에서 .env 로드
]

# ---------------------------------------------------------------
# 설치 (backend/ 안에서):
#   python -m venv .venv && source .venv/bin/activate
#   pip install -e ".[dev]"
# 기동:
#   uvicorn app.main:app --reload --port 8000
# ---------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "md-rag-backend"
version = "0.1.0"
description = "md-rag-chatbot Python backend (FastAPI)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",           # 웹 프레임워크
    "uvicorn[standard]>=0.32",  # ASGI 서버 (개발/운영 기동)
    "pydantic>=2.9",            # 요청/응답 타입 검증 (TS의 interface 역할)
    "pydantic-settings>=2.6",   # 환경변수 → 타입 있는 Settings 객체
    "httpx>=0.27",              # async HTTP 클라이언트 (GitHub API 호출용)
    "google-genai>=1.0",        # Gemini SDK (임베딩 + 생성)
    "pinecone>=6.0",            # 벡터 DB 클라이언트
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",     # async 함수 테스트
    "respx>=0.21",              # httpx 호출 모킹 (GitHub 어댑터 테스트용)
]

# ---------------------------------------------------------------
# 설치 (backend/ 안에서):
#   python -m venv .venv && source .venv/bin/activate
#   pip install -e ".[dev]"
# 기동:
#   uvicorn app.main:app --reload --port 8000
# ---------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
